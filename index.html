<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Question Paper Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.9/babel.min.js"></script>
<!-- TikZJax: renders <script type="text/tikz"> into SVG in the browser (used by the TikZ diagram mode) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax@1.6.0/dist/fonts.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax@1.6.0/dist/tikzjax.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter','Hind Siliguri',sans-serif;-webkit-font-smoothing:antialiased;background:#f5f3ee}
body{min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.bn{font-family:'Hind Siliguri','Noto Serif Bengali',sans-serif;line-height:1.85}
.bn-serif{font-family:'Noto Serif Bengali',serif;line-height:1.9}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#4f63f8;color:#fff}.btn-primary:hover:not(:disabled){background:#3543ed}
.btn-secondary{background:#fff;color:#1a1d2e;border:1px solid #e8e5de}.btn-secondary:hover{background:#f5f3ee}
.btn-ghost{background:transparent;color:#6b7299;padding:6px 10px}.btn-ghost:hover{background:#f5f3ee}
.btn-danger{background:transparent;color:#dc2626;padding:6px 10px}.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.card{background:#fff;border-radius:12px;border:1px solid #e8e5de;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
.inp{width:100%;padding:8px 12px;border:1px solid #e8e5de;border-radius:8px;font-size:13px;color:#1a1d2e;background:#fff;outline:none;transition:border .15s,box-shadow .15s;font-family:'Hind Siliguri','Inter',sans-serif}
.inp:focus{border-color:#9bb1fd;box-shadow:0 0 0 3px rgba(79,99,248,.12)}
.ta{width:100%;padding:8px 12px;border:1px solid #e8e5de;border-radius:8px;font-size:13px;color:#1a1d2e;background:#fff;outline:none;resize:none;transition:border .15s,box-shadow .15s;font-family:'Hind Siliguri','Inter',sans-serif;line-height:1.8}
.ta:focus{border-color:#9bb1fd;box-shadow:0 0 0 3px rgba(79,99,248,.12)}
.ta-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;resize:vertical}
.lbl{display:block;font-size:11px;font-weight:600;color:#6b7299;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-mcq{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.badge-cq{background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe;font-family:'Hind Siliguri',sans-serif}
.badge-sq{background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}

/* Layout */
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid #e8e5de;height:56px;display:flex;align-items:center;padding:0 16px;gap:8px}
.logo-icon{width:34px;height:34px;border-radius:10px;background:#4f63f8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;font-family:'Noto Serif Bengali',serif;flex-shrink:0}
.logo-p{font-size:13px;font-weight:700;color:#1a1d2e;line-height:1;font-family:'Hind Siliguri',sans-serif}
.logo-s{font-size:11px;color:#6b7299;line-height:1;margin-top:2px}
.main{display:flex;gap:24px;max-width:1300px;margin:0 auto;padding:24px 20px 80px}
.editor-col{width:490px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.preview-col{flex:1;min-width:0}
.preview-sticky{position:sticky;top:68px}
.sec-hdr{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#3d4166;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.sec-hdr::before{content:'';display:inline-block;width:4px;height:16px;background:#4f63f8;border-radius:2px;flex-shrink:0}
.qcard{background:#fff;border-radius:12px;border:1px solid #e8e5de;border-left-width:4px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .15s;margin-bottom:12px;cursor:pointer}
.qcard.active{outline:2px solid #9bb1fd;box-shadow:0 2px 12px rgba(79,99,248,.15)}
.qcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.09)}
.qcard.mc{border-left-color:#3b82f6}.qcard.cq{border-left-color:#8b5cf6}.qcard.sq{border-left-color:#14b8a6}
.qcard-head{display:flex;align-items:center;gap:8px;padding:11px 14px}
.qcard-body{border-top:1px solid #f0ede8;padding:14px}
.qnum{width:22px;height:22px;border-radius:50%;background:#1a1d2e;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qprev{font-size:12px;color:#6b7299;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:'Hind Siliguri',sans-serif}
.notif{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e8e5de;box-shadow:0 8px 32px rgba(0,0,0,.12);border-radius:12px;padding:11px 16px;display:flex;align-items:center;gap:10px;min-width:260px;max-width:380px;z-index:9999;animation:sup .25s ease-out}
@keyframes sup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.2);width:100%;max-width:520px;overflow:hidden;max-height:90vh;overflow-y:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e8e5de}
.mbody{padding:22px;display:flex;flex-direction:column;gap:18px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #e8e5de}
.math-hint{position:fixed;bottom:0;left:0;right:0;background:#1a1d2e;color:rgba(255,255,255,.72);font-size:11px;padding:5px 12px;text-align:center;pointer-events:none;z-index:30}
.math-hint code{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:4px;font-size:10px}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.opt-lbl{width:28px;height:28px;border-radius:50%;background:#eff6ff;border:1px solid #bfdbfe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#1d4ed8;flex-shrink:0;font-family:'Hind Siliguri',sans-serif}
.cq-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.cq-chip{width:24px;height:24px;border-radius:50%;background:#f5f3ff;border:1px solid #ddd6fe;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6d28d9;flex-shrink:0;margin-top:20px}
.add-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.prev-frame{background:#fff;border-radius:12px;border:1px solid #e8e5de;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow-y:auto;max-height:calc(100vh - 128px)}
.tog{position:relative;width:40px;height:20px;border-radius:10px;background:#e5e7eb;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;padding:0}
.tog.on{background:#4f63f8}
.tog-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;pointer-events:none}
.tog.on .tog-dot{transform:translateX(20px)}
.tabbar{display:none;gap:4px;background:#f5f3ee;border:1px solid #e8e5de;border-radius:10px;padding:4px}
.tabbtn{flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#6b7299;transition:all .15s}
.tabbtn.on{background:#fff;color:#1a1d2e;box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* lang toggle */
.lang-tog{display:flex;align-items:center;background:#f5f3ee;border:1px solid #e8e5de;border-radius:8px;padding:3px;gap:2px}
.lang-btn{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#6b7299;transition:all .15s;font-family:'Hind Siliguri',sans-serif}
.lang-btn.on{background:#fff;color:#1a1d2e;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* helper panels */
.tool-panel{border:1px solid #e8e5de;border-radius:12px;background:#fff;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.tool-panel h4{font-size:12px;font-weight:700;color:#3d4166;text-transform:uppercase;letter-spacing:.05em}
.tool-note{font-size:12px;color:#6b7299;line-height:1.6}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;font-size:12px;color:#dc2626;line-height:1.6}
.ok-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;font-size:12px;color:#15803d}
.steps{font-size:12px;color:#3d4166;line-height:1.8;padding-left:18px}

/* ══ PAPER PREVIEW — Board-standard typography ══ */
.pp{
  font-family:'Noto Serif Bengali','Times New Roman',Times,serif;
  font-size:10.5pt;line-height:1.75;color:#111;background:#fff;
  padding:8mm 10mm 10mm 10mm;
  width:100%;
}
.pp-school{font-size:15pt;font-weight:700;text-align:center;line-height:1.3;margin-bottom:2px}
.pp-exam{font-size:12.5pt;font-weight:700;text-align:center;line-height:1.3;margin-bottom:2px}
.pp-subject{font-size:11.5pt;font-weight:700;text-align:center;margin-bottom:4px}
.pp-meta-row{display:flex;justify-content:space-between;align-items:flex-start;font-size:10.5pt;font-weight:500;margin-top:4px;gap:8px}
.pp-meta-left{text-align:left;flex:1}
.pp-meta-right{text-align:right;flex:1}
.pp-meta-row2{display:flex;justify-content:space-between;font-size:10.5pt;margin-top:1px}
.pp-instruction{font-size:8.5pt;font-style:italic;line-height:1.6;margin-top:5px;padding:3px 0 5px;border-bottom:1px solid #555;color:#222}
.pp-hdr{border-bottom:2px double #111;padding-bottom:6px;margin-bottom:0}
.pp-sec{font-size:11.5pt;font-weight:700;text-align:center;
  border-top:1.5px solid #333;border-bottom:1.5px solid #333;
  padding:3px 0;margin:10px 0 8px}
.pp-sec-sub{font-size:9.5pt;font-weight:400;margin-left:8px;color:#444}
.pp-two-col{
  column-count:2;
  column-gap:14px;
  column-rule:1px solid rgba(0,0,0,0.12);
}
.qblock{
  break-inside:avoid;
  page-break-inside:avoid;
  margin-bottom:14px;
}
.qstem{font-size:10.5pt;line-height:1.75;margin-bottom:3px;display:flex;gap:3px;align-items:flex-start}
.qstem-num{flex-shrink:0;font-weight:600;min-width:1.5em}
.qmarks{font-size:9.5pt;color:#444;flex-shrink:0;align-self:flex-start;margin-left:auto;padding-left:4px}
.mcq-opts{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-left:18px;font-size:10pt;margin-top:1px}
.mcq-opt{display:flex;gap:3px;align-items:flex-start;line-height:1.65}
.mcq-diag{max-width:100%;height:auto;display:block;margin:4px auto 4px 18px;max-height:90px;object-fit:contain}
.sq-two-col{column-count:2;column-gap:14px;column-rule:1px solid rgba(0,0,0,0.12)}
.cq-stim-box{margin:0 0 5px 0;font-size:10.5pt;line-height:1.75}
.cq-stim-img{max-width:100%;height:auto;display:block;margin:4px auto;max-height:100px;object-fit:contain}
.cq-subs{margin-left:16px;font-size:10.5pt}
.cq-si{display:flex;gap:5px;margin-bottom:2px;line-height:1.75;align-items:flex-start}
.cq-si-lbl{font-weight:700;min-width:1.5em;flex-shrink:0}
.cq-si-marks{margin-left:auto;flex-shrink:0;padding-left:5px;color:#444;font-size:9.5pt}
.correct-opt{font-weight:700;color:#15803d}
.pp-foot{border-top:1px solid #555;margin-top:18px;padding-top:4px;font-size:8.5pt;color:#555;text-align:center}
.prev-empty{text-align:center;padding:60px 20px;color:#9ca3af}
/* Diagram upload zone */
.diag-zone{border:1.5px dashed #c4b5fd;border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:#faf5ff;transition:all .15s;font-size:12px;color:#6d28d9;margin-top:6px}
.diag-zone:hover{background:#f5f3ff;border-color:#8b5cf6}
.paste-box{width:100%;border:1px solid #e8e5de;border-radius:6px;padding:6px 10px;font-size:12px;color:#6b7299;background:#fafaf8;cursor:pointer;outline:none;caret-color:transparent;margin-top:8px;text-align:center;font-family:'Inter',sans-serif}
.paste-box:focus{border-color:#9bb1fd;box-shadow:0 0 0 3px rgba(79,99,248,.12);color:#1a1d2e;background:#fff}

/* TikZ figures */
.tikz-box{border:1px solid #e8e5de;border-radius:8px;background:#fff;padding:8px;min-height:44px;max-height:260px;overflow:auto;text-align:center;margin-top:8px}
.tikz-box svg{max-width:100%;height:auto}
.tikz-fig{display:block;line-height:0}
.tikz-fig svg{display:block;max-width:100%!important;width:auto!important;height:auto!important;max-height:var(--tikz-h,110px)!important;overflow:visible}
.tikz-mcq{margin:4px auto 4px 18px;text-align:left}
.tikz-cq{margin:4px auto;text-align:center}
.tikz-cq svg{margin:0 auto}

@media(max-width:760px){
  .editor-col{width:100%}.preview-col{display:none}
  .preview-col.mob-show{display:block;flex:none;width:100%}
  .editor-col.mob-hide{display:none}
  .tabbar{display:flex}.logo-p,.logo-s{display:none}
  .main{gap:0;padding:12px 12px 80px}
  .pp-two-col,.sq-two-col{column-count:1}
}
@media print{
  .toolbar,.math-hint,.moverlay,.notif,.editor-col{display:none!important}
  .main{display:block!important;padding:0!important;margin:0!important;max-width:none!important}
  .preview-col{display:block!important;width:100%!important}
  .preview-sticky{position:static!important}
  .preview-sticky > div:first-child{display:none!important}
  .prev-frame{box-shadow:none!important;border:none!important;border-radius:0!important;max-height:none!important;overflow:visible!important;background:transparent!important}
  .pp{padding:10mm 12mm!important;background:#fff!important;width:100%!important}
  .pp-two-col{column-count:2!important;column-gap:12px!important;column-rule:1px solid rgba(0,0,0,0.12)!important;column-fill:balance!important;overflow:visible!important;display:block!important}
  .sq-two-col{column-count:2!important;column-gap:12px!important;column-rule:1px solid rgba(0,0,0,0.12)!important;column-fill:balance!important;overflow:visible!important;display:block!important}
  .qblock{break-inside:avoid!important;page-break-inside:avoid!important;overflow:hidden!important}
  .mcq-opts{break-inside:avoid!important;page-break-inside:avoid!important;display:grid!important;grid-template-columns:1fr 1fr!important}
  @page{margin:0}
}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;color:#6b7299;font-family:Inter,sans-serif"><div style="font-size:32px">⏳</div><p style="font-size:14px">Loading...</p></div></div>
<script type="text/babel" data-presets="react">
const {useState,useReducer,useContext,createContext,useRef,useEffect,useCallback} = React;

/* ── i18n strings ── */
const T = {
  bn: {
    mcqSection:'বহুনির্বাচনি প্রশ্ন',sqSection:'সংক্ষিপ্ত প্রশ্ন',cqSection:'সৃজনশীল প্রশ্ন',
    time:'সময়',marks:'পূর্ণমান',subject:'বিষয়',set:'সেট',received:'প্রাপ্ত নম্বর',
    stimulus:'উদ্দীপক',foot:'— প্রশ্নপত্র সমাপ্ত — শুভকামনা। @mrh.du26',
    opts:{a:'ক',b:'খ',c:'গ',d:'ঘ'},
    markNum:n=>['০','১','২','৩','৪','৫','৬','৭','৮','৯'].reduce((s,d,i)=>s.replace(new RegExp(i,'g'),d),String(n)),
  },
  en: {
    mcqSection:'Multiple Choice Questions',sqSection:'Short Questions',cqSection:'Creative Questions',
    time:'Time',marks:'Total Marks',subject:'Subject',set:'Set',received:'Marks Obtained',
    stimulus:'Stimulus',foot:'— The End. Best of Luck. @mrh.du26',
    opts:{a:'a',b:'b',c:'c',d:'d'},
    markNum:n=>String(n),
  }
};

/* ── Math renderer ── */
let _n=0; const uid=()=>'q_'+Date.now()+'_'+(++_n);
/* Convert \(...\) and \[...\] to $...$ and $$...$$ */
function normDelim(t){
  if(!t) return t;
  t=t.replace(/\\\[([\s\S]*?)\\\]/g,'$$$$$1$$$$');  // \[...\] → $$...$$
  t=t.replace(/\\\(([\s\S]*?)\\\)/g,'$$$1$$');       // \(...\) → $...$
  return t;
}
function renderMath(text){
  if(!text)return'';
  text=normDelim(text);
  let out='';
  for(const seg of text.split(/(\$\$[\s\S]+?\$\$)/g)){
    if(seg.startsWith('$$')&&seg.endsWith('$$')){
      try{out+=katex.renderToString(seg.slice(2,-2),{displayMode:true,throwOnError:false});}
      catch{out+='<span style="color:red">[err]</span>';}
    } else {
      for(const p of seg.split(/(\$[^$\n]+?\$)/g)){
        if(p.startsWith('$')&&p.endsWith('$')&&p.length>2){
          try{out+=katex.renderToString(p.slice(1,-1),{displayMode:false,throwOnError:false});}
          catch{out+='<span style="color:red">[err]</span>';}
        } else out+=p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
    }
  }
  return out;
}
const MText=({t,cls=''})=><span className={cls} dangerouslySetInnerHTML={{__html:renderMath(t||'')}}/>;

/* SmartMText — detects roman numeral statement lists (i. ii. iii.) and stacks them vertically */
function SmartMText({t,cls=''}){
  if(!t) return <span/>;
  const romanRe = /(?=\b(?:i{1,3}|iv|vi{0,3}|ix|xi{0,3}|xi?v?)\.\s)/i;
  const parts = t.split(romanRe).map(s => s.trim()).filter(Boolean);
  if(parts.length <= 1){
    return <span className={cls} dangerouslySetInnerHTML={{__html:renderMath(t)}}/>;
  }
  return(
    <span className={cls} style={{display:'block'}}>
      {parts.map((part,i)=>(
        <span key={i} style={{display:'block',lineHeight:1.75}}
          dangerouslySetInnerHTML={{__html:renderMath(part)}}/>
      ))}
    </span>
  );
}

/* ── State ── */
const makeQ=type=>{
  const base={id:uid(),type};
  if(type==='mcq')return{...base,stem:'',options:{a:'',b:'',c:'',d:''},correctAnswer:'',marks:1,diagramImg:null,diagramMode:'img',diagramTikz:'',diagramSvg:'',diagramH:110,
    stemEn:'',optionsEn:{a:'',b:'',c:'',d:''},translatedAt:null};
  if(type==='cq') return{...base,stimulus:'',subA:'',subB:'',subC:'',subD:'',diagramImg:null,diagramMode:'img',diagramTikz:'',diagramSvg:'',diagramH:110,
    stimulusEn:'',subAEn:'',subBEn:'',subCEn:'',subDEn:'',translatedAt:null};
  return{...base,stem:'',marks:5,stemEn:'',translatedAt:null};
};

/* Clipboard copy with fallback for non-secure contexts */
function copyText(text){
  return new Promise(res=>{
    const fallback=()=>{
      try{
        const ta=document.createElement('textarea');
        ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();
        const ok=document.execCommand('copy');
        document.body.removeChild(ta);res(!!ok);
      }catch(e){res(false);}
    };
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(()=>res(true),fallback);
    } else fallback();
  });
}

/* Tolerant JSON parser: strips code fences / chatter around the JSON, repairs lone backslashes */
function parseJSONLoose(raw){
  let c=(raw||'').trim().replace(/```json\n?/gi,'').replace(/```\n?/g,'').trim();
  if(!c) throw new Error('Paste box is empty.');
  const a=c.search(/[\[{]/);
  if(a>0) c=c.slice(a);
  const e=Math.max(c.lastIndexOf('}'),c.lastIndexOf(']'));
  if(e!==-1) c=c.slice(0,e+1);
  try{return JSON.parse(c);}
  catch(e1){
    try{return JSON.parse(c.replace(/\\\\|\\(?!["\/])/g,m=>m==='\\\\'?m:'\\\\'));}
    catch(e2){throw new Error('Invalid JSON — check the pasted text. ('+e1.message+')');}
  }
}

/* Turn pasted JSON (single question, array, or {questions:[...]}) into clean question objects */
function normalizeQuestions(parsed){

  if(Array.isArray(parsed)) arr=parsed;

  else if(parsed&&typeof parsed==='object'&&parsed.type) arr=[parsed];
  if(!arr||!arr.length) throw new Error('No question found in the JSON.');
  const n=s=>typeof s==='string'?normDelim(s):s;
  return arr.filter(q=>q&&typeof q==='object').map(q=>{
    const type=['mcq','cq','sq'].includes(q.type)?q.type:'sq';
    const o={...q,type};
    delete o.id;
    if(type==='mcq'){
      o.stem=n(q.stem)||'';
      o.options={a:n(q.options?.a)||'',b:n(q.options?.b)||'',c:n(q.options?.c)||'',d:n(q.options?.d)||''};
    } else if(type==='cq'){

/* Make a captured/pasted SVG safe to inline: drop scripts, event handlers, javascript: links */
const _svgCache=new Map();
function sanitizeSvg(str){
  if(!str||typeof str!=='string')return '';
  if(_svgCache.has(str))return _svgCache.get(str);
  let out='';
  try{
    let src=str;
    if(!/<svg[^>]*\sxmlns=/.test(src)) src=src.replace(/<svg\b/,'<svg xmlns="http://www.w3.org/2000/svg"');
    if(/xlink:/.test(src)&&!/xmlns:xlink/.test(src)) src=src.replace(/<svg\b/,'<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
    const doc=new DOMParser().parseFromString(src,'image/svg+xml');
    const root=doc.documentElement;
    if(root&&root.nodeName.toLowerCase()==='svg'&&!doc.querySelector('parsererror')){
      root.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(el=>el.remove());
      [root,...root.querySelectorAll('*')].forEach(el=>{
        [...el.attributes].forEach(a=>{
          const nm=a.name.toLowerCase();
          if(nm.startsWith('on')||((nm==='href'||nm.endsWith(':href'))&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name);
        });
      });
      out=new XMLSerializer().serializeToString(root);
    }
  }catch(e){out='';}
  _svgCache.set(str,out);
  return out;
}
/* Turn the engine's rendered <svg> into stored markup: ensure viewBox/size, make ids unique per question */
function prepareSvg(svg,prefix){
  const num=a=>/%\s*$/.test(a||'')?0:parseFloat(a);
  const c=svg.cloneNode(true);
  const r=svg.getBoundingClientRect();
  if(!c.getAttribute('viewBox')){
    const w=num(c.getAttribute('width'))||r.width,h=num(c.getAttribute('height'))||r.height;
    if(!(w>0&&h>0))return '';
    c.setAttribute('viewBox','0 0 '+w+' '+h);
  }
  if(!(num(c.getAttribute('width'))>0)||!(num(c.getAttribute('height'))>0)){
    const p=c.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    if(!(p[2]>0&&p[3]>0))return '';
    c.setAttribute('width',p[2]);c.setAttribute('height',p[3]);
  }
  c.querySelectorAll('script,foreignObject').forEach(el=>el.remove());
  let s=new XMLSerializer().serializeToString(c);
  [...new Set([...s.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]))].forEach(id=>{
    const nid=prefix+'_'+id;
    const esc=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('id="'+esc+'"','g'),'id="'+nid+'"')
       .replace(new RegExp('url\\(#'+esc+'\\)','g'),'url(#'+nid+')')
       .replace(new RegExp('href="#'+esc+'"','g'),'href="#'+nid+'"');
  });
  return s;
}

    if(obs.current){obs.current.disconnect();obs.current=null;}
    clearTimeout(settle.current);clearTimeout(tmo.current);
    if(evRef.current){window.removeEventListener('tikzjax-load-finished',evRef.current,true);evRef.current=null;}
  };
  useEffect(()=>()=>{stop();clearTimeout(deb.current);},[]);

  /* Take the finished <svg> out of the render box and save it on the question */
  const grab=force=>{
    const box=boxRef.current;if(!box)return false;
    const all=[...box.querySelectorAll('svg')];
    const svgs=force?all:all.filter(s=>!isLoaderSvg(s));
    if(!svgs.length)return false;
    const markup=prepareSvg(svgs[svgs.length-1],prefix);
    if(!markup)return false;
    d({t:'UPD_Q',id:q.id,p:{diagramSvg:markup,diagramMode:'tikz'}});
    setStatus('ok');setMsg('');stop();
    return true;
  };

  const render=src=>{
    const box=boxRef.current;if(!box)return;
    stop();box.innerHTML='';
    if(!src.trim()){setStatus('idle');setMsg('');d({t:'UPD_Q',id:q.id,p:{diagramSvg:''}});return;}
    setStatus('rendering');setMsg('');
    evRef.current=()=>setTimeout(()=>grab(true),60);
    window.addEventListener('tikzjax-load-finished',evRef.current,true);
    obs.current=new MutationObserver(()=>{
      clearTimeout(settle.current);
      settle.current=setTimeout(()=>{
        if(grab(false))return;
        if(/error|emergency stop|undefined control sequence|runaway|missing/i.test(box.textContent||'')){
          setStatus('error');setMsg('The TikZ engine reported a problem — see the message in the box below, fix the code and render again.');stop();
        }
      },2500);
    });
    obs.current.observe(box,{childList:true,subtree:true,characterData:true});
    tmo.current=setTimeout(()=>{stop();setStatus('error');setMsg('No output after 60 seconds. Check your internet connection (the TeX engine is downloaded on first use) and the TikZ code.');},60000);
    const sc=document.createElement('script');
    sc.type='text/tikz';sc.textContent=src;
    box.appendChild(sc);
  };

  /* On open: show the stored SVG straight away; render only if there is code but no SVG yet */
  useEffect(()=>{
    const box=boxRef.current;if(!box)return;
    if(q.diagramSvg){box.innerHTML=sanitizeSvg(q.diagramSvg);setStatus('ok');}
    else if((q.diagramTikz||'').trim())render(q.diagramTikz);
  },[]);

  const onCode=v=>{
    setCode(v);
    d({t:'UPD_Q',id:q.id,p:{diagramTikz:v}});
    clearTimeout(deb.current);
    deb.current=setTimeout(()=>render(v),1500);
  };
  const copyPrompt=async()=>{
    const ok=await copyText(TIKZ_PROMPT);
    if(ok){setCopied(true);setTimeout(()=>setCopied(false),1800);}
    else d({t:'NOTIF',p:{type:'error',msg:'Could not copy. Check browser clipboard permission.'}});
  };
  const clearAll=()=>{
    stop();clearTimeout(deb.current);
    if(boxRef.current)boxRef.current.innerHTML='';
    setCode('');setStatus('idle');setMsg('');
    d({t:'UPD_Q',id:q.id,p:{diagramTikz:'',diagramSvg:''}});
  };
  const statusTxt={idle:'',rendering:'⏳ Rendering… the first diagram downloads the TeX engine and can take 10–30 s.',ok:'✅ Rendered and saved with the question.',error:'⚠️ '+msg}[status];

  return(
    <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:8}} onClick={e=>e.stopPropagation()}>
      <textarea className="ta ta-code" rows={8} spellCheck={false} style={{background:'#faf5ff',borderColor:'#c4b5fd'}}
        placeholder={TIKZ_EXAMPLE} value={code} onChange={e=>onCode(e.target.value)}/>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-primary btn-sm" onClick={()=>{clearTimeout(deb.current);render(code);}} disabled={!code.trim()||status==='rendering'}>▶ Render now</button>
        <button className="btn btn-secondary btn-sm" onClick={copyPrompt}>{copied?'✅ Copied!':'📋 Copy TikZ prompt for AI'}</button>
        <label style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:'#6b7299'}}>Max height
          <input type="number" min={40} max={400} className="inp" style={{width:64,textAlign:'center',padding:'4px 6px'}} value={q.diagramH||110}
            onChange={e=>d({t:'UPD_Q',id:q.id,p:{diagramH:Math.max(40,Math.min(400,parseInt(e.target.value)||110))}})}/>px
        </label>
        <div style={{flex:1}}/>
        {(code||q.diagramSvg)&&<button className="btn btn-danger btn-sm" onClick={clearAll}>✕ Clear</button>}
      </div>
      {statusTxt&&<div style={{fontSize:12,color:status==='error'?'#dc2626':status==='ok'?'#15803d':'#6b7299',lineHeight:1.6}}>{statusTxt}</div>}
      <div ref={boxRef} className="tikz-box"/>
      <p style={{fontSize:11,color:'#9ca3af',lineHeight:1.6}}>Labels must be Latin letters, digits or math like <code>$A$</code> — the TikZ engine cannot draw Bangla text. Put any <code>\usetikzlibrary{'{...}'}</code> line before <code>\begin{'{tikzpicture}'}</code>. For Bangla labels, use the Image mode instead.</p>
    </div>
  );
}

/* ── Bulk English translation (manual): one prompt for many questions ── */
function TranslateAllPanel({onClose}){
  const{s,d}=useApp();
  const[onlyNew,setOnlyNew]=useState(true);
  const[text,setText]=useState('');
  const[err,setErr]=useState('');
  const[copied,setCopied]=useState(false);
  const qs=s.questions;
  const subset=qs.map((q,i)=>({q,i})).filter(x=>!onlyNew||!hasEn(x.q));
  const copy=async()=>{
    if(!subset.length){d({t:'NOTIF',p:{type:'warning',msg:'Nothing to translate — every question already has English.'}});return;}
    const ok=await copyText(buildTranslationPrompt(subset.map(x=>({q:x.q,no:x.i+1}))));
    if(ok){setCopied(true);setTimeout(()=>setCopied(false),1800);}
    else d({t:'NOTIF',p:{type:'error',msg:'Could not copy. Check browser clipboard permission.'}});
  };
  const apply=()=>{
    setErr('');
    try{
      const list=extractTranslationList(parseJSONLoose(text));
      let n=0;
      list.forEach((o,pos)=>{
        if(!o||typeof o!=='object')return;
        const target=o.no?qs[Number(o.no)-1]:(subset[pos]&&subset[pos].q);
        if(!target)return;
        d({t:'UPD_Q',id:target.id,p:pickTranslation(target,o)});n++;
      });
      if(!n) throw new Error('No matching questions found. Make sure each item keeps its "no" value.');
      d({t:'NOTIF',p:{type:'success',msg:'English applied to '+n+' question(s).'}});
      setText('');onClose();
    }catch(e){setErr(e.message);}
  };
  return(
    <div className="tool-panel">
      <h4>🌐 Translate Questions to English</h4>
      <ol className="steps">
        <li>Copy the prompt (it contains the Bangla questions and the rules).</li>
        <li>Paste it into Claude / Gemini / ChatGPT and send.</li>
        <li>Paste the JSON reply below and apply.</li>
      </ol>
      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#3d4166',cursor:'pointer'}}>
        <input type="checkbox" checked={onlyNew} onChange={e=>setOnlyNew(e.target.checked)}/> Only questions without English yet ({subset.length} of {qs.length})
      </label>
      <div><button className="btn btn-secondary btn-sm" onClick={copy}>{copied?'✅ Copied!':'📋 Copy translation prompt'}</button></div>
      <textarea className="ta ta-code" rows={6} placeholder={'{"translations":[{"no":1,"stemEn":"..."}, ...]}'} value={text} onChange={e=>{setText(e.target.value);setErr('');}}/>
      {err&&<div className="err-box">⚠️ {err}</div>}
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-primary" style={{flex:1}} onClick={apply} disabled={!text.trim()}>✅ Apply translations</button>
        <button className="btn btn-secondary" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

/* Question list */
function QList(){
  const{s,d}=useApp();const{questions}=s;
  const[panel,setPanel]=useState(null); // 'paste' | 'tr' | null
  const di=useRef(null),dv=useRef(null);
  const add=t=>d({t:'ADD_Q',p:t});
  const reorder=()=>{
    if(di.current===null||dv.current===null||di.current===dv.current)return;
    const qs=[...questions];const[m]=qs.splice(di.current,1);qs.splice(dv.current,0,m);
    d({t:'REORDER',p:qs});di.current=null;dv.current=null;
  };
  const copyAll=async()=>{
    if(!questions.length){d({t:'NOTIF',p:{type:'warning',msg:'No questions to copy.'}});return;}
    const payload={questions:questions.map(q=>{const{id,diagramImg,...rest}=q;return rest;})};
    const ok=await copyText(JSON.stringify(payload,null,2));
    d({t:'NOTIF',p:ok?{type:'success',msg:questions.length+' question(s) copied as JSON.'}:{type:'error',msg:'Could not copy. Check browser clipboard permission.'}});
  };
  return(
    <div>
      <div className="add-btns">
        <button className="btn btn-secondary" style={{color:'#1d4ed8',borderColor:'#bfdbfe'}} onClick={()=>add('mcq')}>📝 + MCQ</button>
        <button className="btn btn-secondary" style={{color:'#6d28d9',borderColor:'#ddd6fe',fontFamily:"'Hind Siliguri',sans-serif"}} onClick={()=>add('cq')}>📚 + সৃজনশীল</button>
        <button className="btn btn-secondary" style={{color:'#0f766e',borderColor:'#99f6e4'}} onClick={()=>add('sq')}>✏️ + Short Q</button>
      </div>
      <div className="add-btns" style={{marginTop:-4}}>
        <button className={panel==='paste'?'btn btn-primary btn-sm':'btn btn-secondary btn-sm'} onClick={()=>setPanel(p=>p==='paste'?null:'paste')}>📥 Paste JSON</button>
        <button className="btn btn-secondary btn-sm" onClick={copyAll}>📋 Copy all as JSON</button>
        <button className={panel==='tr'?'btn btn-primary btn-sm':'btn btn-secondary btn-sm'} onClick={()=>setPanel(p=>p==='tr'?null:'tr')} disabled={!questions.length}>🌐 Translate all</button>
      </div>
      {panel==='paste'&&<PasteQuestionPanel onClose={()=>setPanel(null)}/>}
      {panel==='tr'&&<TranslateAllPanel onClose={()=>setPanel(null)}/>}
      {questions.length===0&&(
        <div className="card" style={{padding:40,textAlign:'center'}}>
          <div style={{fontSize:36,marginBottom:12}}>📋</div>
          <p style={{fontWeight:600,color:'#1a1d2e',marginBottom:6}}>No questions yet</p>
          <p style={{fontSize:13,color:'#6b7299',maxWidth:260,margin:'0 auto',lineHeight:1.6}}>Add questions above, paste question JSON, or import from an AI reply.</p>
        </div>
      )}
      {questions.map((q,i)=>(
        <QCard key={q.id} q={q} idx={i} onDS={()=>{di.current=i}} onDE={()=>{dv.current=i}} onDEnd={reorder}/>
      ))}
    </div>
  );
}

/* ── Import from AI (manual): copy prompt → run with image in your AI → paste JSON reply ── */
function ExtractPanel(){
  const{d}=useApp();
  const[text,setText]=useState('');
  const[result,setRes]=useState(null);
  const[err,setErr]=useState('');
  const[copied,setCopied]=useState(false);

  const copyPrompt=async()=>{
    const ok=await copyText(EXTERNAL_PROMPT);
    if(ok){setCopied(true);setTimeout(()=>setCopied(false),1800);}
    else setErr('Could not copy automatically — open “View prompt” and copy it by hand.');
  };
  const parse=()=>{
    setErr('');
    try{setRes(normalizeQuestions(parseJSONLoose(text)));}
    catch(e){setErr(e.message);setRes(null);}
  };
  const importAll=()=>{
    if(!result||!result.length)return;
    d({t:'IMPORT',p:result});
    d({t:'NOTIF',p:{type:'success',msg:result.length+' question(s) imported!'}});
    setText('');setRes(null);setErr('');
  };

  return(
    <div className="card" style={{padding:18,display:'flex',flexDirection:'column',gap:10}}>
      <div className="sec-hdr" style={{margin:0}}>Import Questions from AI</div>
      <ol className="steps">
        <li>Copy the extraction prompt.</li>
        <li>Open Claude / Gemini / ChatGPT, attach your question-paper image, paste the prompt.</li>
        <li>Paste the JSON reply below, parse, then import.</li>
      </ol>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-secondary btn-sm" onClick={copyPrompt}>{copied?'✅ Copied!':'📄 Copy Extraction Prompt'}</button>
      </div>
      <details>
        <summary style={{fontSize:12,color:'#6b7299',cursor:'pointer'}}>View prompt</summary>
        <textarea className="ta ta-code" rows={8} readOnly value={EXTERNAL_PROMPT} style={{marginTop:6,background:'#fafaf8'}} onFocus={e=>e.target.select()}/>
      </details>
      <textarea className="ta ta-code" rows={7} placeholder={'Paste the AI JSON reply here, e.g. {"questions":[{"type":"mcq", ...}]}'}
        value={text} onChange={e=>{setText(e.target.value);setRes(null);setErr('');}}/>
      {err&&<div className="err-box">⚠️ {err}</div>}
      {result&&<div className="ok-box">
        <div style={{fontWeight:700,marginBottom:5}}>✅ Found {result.length} question(s)</div>
        <ul style={{listStyle:'disc',paddingLeft:16,color:'#166534'}}>
          {result.slice(0,5).map((q,i)=><li key={i}>[{(q.type||'?').toUpperCase()}] {(q.stem||q.stimulus||'').slice(0,50)}</li>)}
          {result.length>5&&<li>…and {result.length-5} more</li>}
        </ul>
      </div>}
      <div style={{display:'flex',gap:8}}>
        {!result&&<button className="btn btn-primary" style={{flex:1}} onClick={parse} disabled={!text.trim()}>✨ Parse JSON</button>}
        {result&&<button className="btn btn-primary" style={{flex:1}} onClick={importAll}>✅ Import {result.length} Question{result.length>1?'s':''}</button>}
        {result&&<button className="btn btn-secondary" onClick={()=>{setRes(null);setErr('');}}>↩ Edit</button>}
        <button className="btn btn-secondary" onClick={()=>{setText('');setRes(null);setErr('');}}>Clear</button>
      </div>
    </div>
  );
}

/* ══ PAPER PREVIEW — Board standard layout ══ */
function Preview({forPDF}){
  const{s}=useApp();
  const{header:h,questions,settings}=s;
  const lang=settings.lang||'bn';
  const pm=settings.paperMode||'bn';
  const tr=T[lang];
  const L=pm==='en'?T.en.opts:tr.opts;
  const sa=settings.showAns;
  const mcqs=questions.filter(q=>q.type==='mcq');
  const cqs=questions.filter(q=>q.type==='cq');
  const sqs=questions.filter(q=>q.type==='sq');
  const mmk=mcqs.reduce((a,q)=>a+(q.marks||1),0);
  const cmk=cqs.length*10;
  const smk=sqs.reduce((a,q)=>a+(q.marks||5),0);
  const isEN=pm==='bn'?false:true;
  const txt=(bn,en)=>isEN?(en||bn||''):(bn||'');
  const num=n=>isEN?n:(lang==='bn'?toBanglaNum(n):n);

  return(
    <div id={forPDF?'pdf-root':undefined} className="pp">
      <div className="pp-hdr">
        {h.schoolName&&<div className="pp-school">{h.schoolName}</div>}
        {h.examTitle&&<div className="pp-exam">{h.examTitle}</div>}
        {(h.subject||h.subjectCode)&&(
          <div className="pp-subject">
            {h.subject&&<span>{tr.subject}: {h.subject}</span>}
            {h.subjectCode&&<span style={{marginLeft:12,fontWeight:400,fontSize:'10pt'}}>[{h.subjectCode}]</span>}
          </div>
        )}
        {(h.time||h.totalMarks||h.year)&&(
          <div className="pp-meta-row">
            <div className="pp-meta-left">{h.time&&<span><strong>{tr.time}:</strong> {h.time}</span>}</div>
            <div style={{textAlign:'center',flex:1,color:'#555',fontSize:'9.5pt'}}>{h.year}</div>
            <div className="pp-meta-right">{h.totalMarks&&<span><strong>{tr.marks}:</strong> {h.totalMarks}</span>}</div>
          </div>
        )}
        {h.set&&<div className="pp-meta-row2"><span><strong>{tr.set}:</strong> {h.set}</span><span><strong>{tr.received}:</strong> ____</span></div>}
        {(isEN?h.instructionsEn:h.instructions)&&<div className="pp-instruction" style={{whiteSpace:'pre-line'}}>{isEN?h.instructionsEn:h.instructions}</div>}
      </div>

      {questions.length===0&&<div className="prev-empty"><div style={{fontSize:36,marginBottom:10}}>📄</div><p style={{fontWeight:600}}>Your paper will appear here</p></div>}

      {mcqs.length>0&&<>
        <div className="pp-sec">{isEN?'Multiple Choice Questions':tr.mcqSection}<span className="pp-sec-sub">[{num(mmk)} {isEN?'marks':lang==='bn'?'নম্বর':'marks'}]</span></div>
        <div className="pp-two-col">
          {mcqs.map((q,i)=>(
            <div key={q.id} className="qblock">
              <div className="qstem">
                <span className="qstem-num">{num(i+1)}.</span>
                <span style={{flex:1}}><SmartMText t={txt(q.stem,q.stemEn)}/></span>
              </div>
              <FigureView q={q} kind="mcq"/>
              <div className="mcq-opts">
                {['a','b','c','d'].map(k=>(
                  <div key={k} className={'mcq-opt'+(sa&&q.correctAnswer===k?' correct-opt':'')}>
                    <span style={{fontWeight:600,flexShrink:0}}>({L[k]})</span>
                    <MText t={txt(q.options?.[k]||'',q.optionsEn?.[k]||'')}/>
                    {sa&&q.correctAnswer===k&&<span style={{color:'#15803d',marginLeft:3}}>✓</span>}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </>}

      {sqs.length>0&&<>
        <div className="pp-sec">{isEN?'Short Questions':tr.sqSection}<span className="pp-sec-sub">[{num(smk)} {isEN?'marks':lang==='bn'?'নম্বর':'marks'}]</span></div>
        <div className="sq-two-col">
          {sqs.map((q,i)=>(
            <div key={q.id} className="qblock">
              <div className="qstem">
                <span className="qstem-num">{num(i+1)}.</span>
                <span style={{flex:1}}><SmartMText t={txt(q.stem,q.stemEn)}/></span>
                <span className="qmarks">{num(q.marks||5)}</span>
              </div>
            </div>
          ))}
        </div>
      </>}

      {cqs.length>0&&<>
        <div className="pp-sec">{isEN?'Creative Questions':tr.cqSection}<span className="pp-sec-sub">[{num(cmk)} {isEN?'marks':lang==='bn'?'নম্বর':'marks'}]</span></div>
        {cqs.length>1?(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 20px'}}>
            {cqs.map((q,i)=><CQPreview key={q.id} q={q} i={i} tr={tr} lang={lang} isEN={isEN} txt={txt} num={num}/>)}
          </div>
        ):(
          cqs.map((q,i)=><CQPreview key={q.id} q={q} i={i} tr={tr} lang={lang} isEN={isEN} txt={txt} num={num}/>)
        )}
      </>}

      {questions.length>0&&<div className="pp-foot">{tr.foot}</div>}
    </div>
  );
}

/* CQ preview sub-component */
function CQPreview({q,i,tr,lang,isEN,txt,num}){
  const isMath=!!(q.subC&&!q.subD);
  const subMeta=isMath?[
    {k:'subA',kEn:'subAEn',l:'ক',le:'a',m:2},
    {k:'subB',kEn:'subBEn',l:'খ',le:'b',m:4},
    {k:'subC',kEn:'subCEn',l:'গ',le:'c',m:4}
  ]:[
    {k:'subA',kEn:'subAEn',l:'ক',le:'a',m:1},
    {k:'subB',kEn:'subBEn',l:'খ',le:'b',m:2},
    {k:'subC',kEn:'subCEn',l:'গ',le:'c',m:3},
    {k:'subD',kEn:'subDEn',l:'ঘ',le:'d',m:4}
  ];
  return(
    <div className="qblock">
      {(q.stimulus||q.stimulusEn)?
        <div className="cq-stim-box" style={{display:'flex',gap:3}}><span className="qstem-num" style={{fontWeight:700}}>{num(i+1)}.</span><span><MText t={txt(q.stimulus,q.stimulusEn)}/></span></div>
        :<div className="qstem" style={{fontWeight:700}}><span className="qstem-num">{num(i+1)}.</span></div>}
      <FigureView q={q} kind="cq"/>
      <div className="cq-subs">
        {subMeta.map(sub=>{
          const content=txt(q[sub.k],q[sub.kEn]);
          return content?(
            <div key={sub.k} className="cq-si">
              <span className="cq-si-lbl">{isEN?sub.le:lang==='bn'?sub.l:sub.le})</span>
              <span style={{flex:1}}><MText t={content}/></span>
              <span className="cq-si-marks">{num(sub.m)}</span>
            </div>
          ):null;
        })}
      </div>
    </div>
  );
}

/* Bangla numeral helper */
function toBanglaNum(n){
  return String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
}

/* Toolbar */
function Toolbar(){
  const{s,d}=useApp();
  const fileInputRef=useRef(null);
  const notify=(type,msg)=>d({t:'NOTIF',p:{type,msg}});
  const lang=s.settings.lang||'bn';
  const pm=s.settings.paperMode||'bn';
  const translatedCount=s.questions.filter(hasEn).length;

  const handlePrint=()=>{
    if(!s.questions.length){notify('warning','Add questions first.');return;}
    window.print();
  };
  const clearAll=()=>{
    if(!s.questions.length)return;
    if(window.confirm('Clear all questions and header? This cannot be undone.')){d({t:'CLEAR'});notify('success','Paper cleared.');}
  };
  const handleSaveProject=()=>{
    if(!s.questions.length){notify('warning','Add questions first.');return;}
    const payload={header:s.header,questions:s.questions,paperMode:s.settings.paperMode,savedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const safeName=(s.header.examTitle||s.header.subject||'question-paper').trim().replace(/[^a-zA-Z0-9\u0980-\u09FF_-]+/g,'_').slice(0,60)||'question-paper';
    a.href=url;a.download=`${safeName}.qpb.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notify('success','Saved progress file.');
  };
  const handleLoadClick=()=>fileInputRef.current&&fileInputRef.current.click();
  const handleFileChosen=(e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(!parsed||!Array.isArray(parsed.questions))throw new Error('Missing "questions" array.');
        const proceed=s.questions.length===0||window.confirm('This will replace your current questions and header with the file\'s contents. Continue?');
        if(!proceed)return;
        d({t:'LOAD_PROJECT',p:parsed});
        notify('success',`Loaded ${parsed.questions.length} question(s).`);
      }catch(err){
        notify('error','Invalid progress file: '+err.message);
      }
    };
    reader.onerror=()=>notify('error','Could not read file.');
    reader.readAsText(file);
  };

  return(
    <header className="toolbar">
      <div className="logo-icon">প্র</div>
      <div style={{marginRight:4}}>
        <div className="logo-p">প্রশ্নপত্র বিল্ডার</div>
        <div className="logo-s">SSC / HSC Question Builder</div>
      </div>
      <div className="tabbar" style={{flex:1,maxWidth:160}}>
        <button className={'tabbtn'+(s.ui.tab==='editor'?' on':'')} onClick={()=>d({t:'TAB',p:'editor'})}>✏️ Edit</button>
        <button className={'tabbtn'+(s.ui.tab==='preview'?' on':'')} onClick={()=>d({t:'TAB',p:'preview'})}>👁️ Preview</button>
      </div>
      <div style={{flex:1}}/>
      <div className="lang-tog" title="Switch preview language labels">
        <button className={'lang-btn'+(lang==='bn'?' on':'')} onClick={()=>d({t:'SETTINGS',p:{lang:'bn'}})}>বাং</button>
        <button className={'lang-btn'+(lang==='en'?' on':'')} onClick={()=>d({t:'SETTINGS',p:{lang:'en'}})}>EN</button>
      </div>
      <div className="lang-tog" title="Switch paper version (Bangla / English questions)">
        <button className={'lang-btn'+(pm==='bn'?' on':'')} style={{color:pm==='bn'?'#1a1d2e':'#6b7299'}} onClick={()=>d({t:'SETTINGS',p:{paperMode:'bn'}})}>📄বাং</button>
        <button className={'lang-btn'+(pm==='en'?' on':'')} style={{color:pm==='en'?'#059669':'#6b7299',background:pm==='en'?'#d1fae5':undefined}} onClick={()=>d({t:'SETTINGS',p:{paperMode:'en'}})}>📄EN{translatedCount>0?<span style={{fontSize:9,marginLeft:2,background:'#059669',color:'#fff',borderRadius:99,padding:'0 4px'}}>{translatedCount}</span>:null}</button>
      </div>
      {s.questions.length>0&&<span className="badge badge-mcq">{s.questions.length} Q</span>}
      <button className="btn btn-primary" onClick={handlePrint} title="Print">🖨️ <span>Print</span></button>
      <button className="btn btn-ghost" onClick={handleSaveProject} title="Save progress as a JSON file you can re-upload later">💾 <span>Save</span></button>
      <button className="btn btn-ghost" onClick={handleLoadClick} title="Load a previously saved progress JSON file">📂 <span>Load</span></button>
      <input ref={fileInputRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={handleFileChosen}/>
      <button className="btn btn-ghost" onClick={clearAll} style={{color:'#dc2626'}} title="Clear all">🗑</button>
      <button className="btn btn-ghost" onClick={()=>d({t:'SETOPEN',p:true})} title="Settings">⚙️</button>
    </header>
  );
}

/* App */
function App(){
  const{s}=useApp();const tab=s.ui.tab;
  return(
    <div>
      <Toolbar/>
      <div className="main">
        <div className={'editor-col'+(tab==='preview'?' mob-hide':'')}>
          <HeaderEditor/>
          <ExtractPanel/>
          <div>
            <div className="sec-hdr">Questions{s.questions.length>0&&<span className="badge badge-mcq" style={{marginLeft:8}}>{s.questions.length}</span>}</div>
            <QList/>
          </div>
        </div>
        <div className={'preview-col'+(tab==='preview'?' mob-show':'')}>
          <div className="preview-sticky">
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <div className="sec-hdr" style={{margin:0,flex:1}}>Live Preview</div>
              <span style={{fontSize:11,color:'#9ca3af'}}>A4 · Board standard</span>
            </div>
            <div className="prev-frame"><Preview/></div>
          </div>
        </div>
      </div>
      <div className="math-hint">
        💡 Math: <code>$x^2 + y^2$</code> inline &nbsp;|&nbsp; <code>$$\frac{"{a}"}{"{b}"}$$</code> block &nbsp;|&nbsp; বাং/EN toggle switches preview language
      </div>
      <Settings/>
      <Toast/>
    </div>
  );
}

function Root(){
  const[s,d]=useReducer(reducer,initState);
  useEffect(()=>{
    const t=setTimeout(()=>{
      try{
        if(typeof localStorage==='undefined')return;
        localStorage.setItem(AUTOSAVE_KEY,JSON.stringify({header:s.header,questions:s.questions,paperMode:s.settings.paperMode}));
      }catch(e){/* storage full/unavailable — ignore */}
    },400);
    return()=>clearTimeout(t);
  },[s.header,s.questions,s.settings.paperMode]);
  return<Ctx.Provider value={{s,d}}><App/></Ctx.Provider>;
}
const container=document.getElementById('root');
const root=ReactDOM.createRoot(container);
root.render(React.createElement(Root));
</script>
